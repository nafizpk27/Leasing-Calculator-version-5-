<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leasing Calculator</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap">
  <style>
    :root {
      --primary: #6C63FF;
      --primary-light: #8A84FF;
      --primary-dark: #534BC7;
      --secondary: #FF6584;
      --accent: #FFB74D;
      --light: #F8F9FA;
      --light-gray: #E9ECEF;
      --medium-gray: #ADB5BD;
      --dark: #212529;
      --white: #FFFFFF;
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 25px rgba(0, 0, 0, 0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light);
      color: var(--dark);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: radial-gradient(circle at 10% 20%, rgba(108, 99, 255, 0.05) 0%, rgba(108, 99, 255, 0.05) 90%);
    }

    .calculator-container {
      width: 100%;
      max-width: 800px;
      margin: 2rem;
      overflow: hidden;
    }

    .calculator {
      background-color: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      position: relative;
    }

    .calculator::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .calculator-header {
      padding: 2.5rem 2rem 1.5rem;
      text-align: center;
      background-color: var(--white);
    }

    .calculator-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }

    .calculator-header p {
      color: var(--medium-gray);
      font-size: 1rem;
      max-width: 500px;
      margin: 0 auto;
    }

    .calculator-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      padding: 0 2rem 2rem;
    }

    @media (max-width: 768px) {
      .calculator-body {
        grid-template-columns: 1fr;
      }
    }

    .input-section {
      display: flex;
      flex-direction: column;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .input-group label {
      display: block;
      margin-bottom: 0.75rem;
      font-weight: 500;
      color: var(--dark);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 1rem 1rem 1rem 3rem;
      border: 2px solid var(--light-gray);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      transition: var(--transition);
      background-color: var(--light);
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
    }

    .term-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .term-option {
      background-color: var(--white);
      border: 2px solid var(--light-gray);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .term-option:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
    }

    .term-option.active {
      background-color: var(--primary);
      color: var(--white);
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .results-section {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .payment-card {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius-md);
      padding: 2rem;
      color: var(--white);
      box-shadow: var(--shadow-md);
      margin-bottom: 1.5rem;
      transition: var(--transition);
    }

    .payment-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .payment-card h3 {
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      opacity: 0.9;
    }

    .payment-amount {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .payment-term {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      margin-top: 1rem;
    }

    .btn:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-outline {
      background-color: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .btn-outline:hover {
      background-color: rgba(108, 99, 255, 0.1);
      color: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .btn i {
      margin-right: 0.5rem;
    }

    .benefits-list {
      list-style: none;
      margin-top: 1.5rem;
    }

    .benefits-list li {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .benefits-list li::before {
      content: '✓';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      background-color: var(--primary);
      color: var(--white);
      border-radius: 50%;
      margin-right: 0.75rem;
      font-size: 0.7rem;
    }

    /* Modal styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(5px);
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background-color: var(--white);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      box-shadow: var(--shadow-lg);
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--medium-gray);
      transition: var(--transition);
    }

    .modal-close:hover {
      color: var(--primary);
      transform: rotate(90deg);
    }

    .modal-header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .modal-header h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--primary-dark);
      margin-bottom: 0.5rem;
    }

    .modal-header p {
      color: var(--medium-gray);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 2px solid var(--light-gray);
      border-radius: var(--radius-sm);
      font-family: 'Poppins', sans-serif;
      transition: var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .submit-btn {
      position: relative;
      overflow: hidden;
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }

    .submit-btn:focus:not(:active)::after {
      animation: ripple 1s ease-out;
    }

    @keyframes ripple {
      0% {
        transform: scale(0, 0);
        opacity: 0.5;
      }
      100% {
        transform: scale(20, 20);
        opacity: 0;
      }
    }

    .loading-spinner {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--white);
      animation: spin 1s ease-in-out infinite;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: var(--secondary);
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="calculator-container">
    <div class="calculator">
      <div class="calculator-header">
        <h2</h2>
        <p></p>
      </div>

      <div class="calculator-body">
        <div class="input-section">
          <div class="input-group">
            <label for="invoice-amount">Equipment Value (ex GST)</label>
            <div class="input-wrapper">
              <span class="icon">$</span>
              <input type="text" id="invoice-amount" placeholder="50,000" value="50,000">
            </div>
          </div>

          <div class="input-group">
            <label>Lease Term</label>
            <div class="term-options">
              <div class="term-option" data-months="12">1 Year</div>
              <div class="term-option" data-months="24">2 Years</div>
              <div class="term-option active" data-months="36">3 Years</div>
              <div class="term-option" data-months="48">4 Years</div>
              <div class="term-option" data-months="60">5 Years</div>
            </div>
          </div>

          <button id="calculate-btn" class="btn">
            <i class="fas fa-calculator"></i> Update Calculation
          </button>


        </div>

        <div class="results-section">
          <div class="payment-card">
            <h3>Your Estimated Payment</h3>
            <div class="payment-amount" id="selected-payment">$1,647.00</div>
            <div class="payment-term" id="selected-term">36 month term</div>
          </div>

          <button id="consult-btn" class="btn btn-outline">
            <i class="fas fa-headset"></i> Speak with an Expert
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <button class="modal-close" id="close-modal">&times;</button>
      <div class="modal-header">
        <h3>Personalized Leasing Advice</h3>
        <p>Our expert will contact you within 24 hours</p>
      </div>
      <form id="consultation-form">
        <div class="form-group">
          <label for="modal-amount">Equipment Value</label>
          <input type="text" id="modal-amount" readonly>
        </div>
        <div class="form-group">
          <label for="modal-name">Your Name</label>
          <input type="text" id="modal-name" required>
        </div>
        <div class="form-group">
          <label for="modal-email">Email Address</label>
          <input type="email" id="modal-email" required>
        </div>
        <div class="form-group">
          <label for="modal-phone">Phone Number</label>
          <input type="tel" id="modal-phone" required>
        </div>
        <div class="form-group">
          <label for="modal-company">Company Name (Optional)</label>
          <input type="text" id="modal-company">
        </div>
        <button type="submit" class="btn submit-btn" id="submit-form">
          <span id="submit-spinner" class="loading-spinner hidden"></span>
          <span id="submit-text">Get Personalized Quote</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // DOM Elements
      const invoiceAmountInput = document.getElementById('invoice-amount');
      const termOptions = document.querySelectorAll('.term-option');
      const calculateBtn = document.getElementById('calculate-btn');
      const consultBtn = document.getElementById('consult-btn');
      const modal = document.getElementById('modal');
      const closeModal = document.getElementById('close-modal');
      const consultationForm = document.getElementById('consultation-form');
      const modalAmount = document.getElementById('modal-amount');
      const submitText = document.getElementById('submit-text');
      const submitSpinner = document.getElementById('submit-spinner');

      // Payment rates
      const rates = {
        "10000-49999": { "12": 0.09035, "24": 0.04725, "36": 0.03292, "48": 0.02578, "60": 0.02152 },
        "50000-199999": { "12": 0.09005, "24": 0.04692, "36": 0.03258, "48": 0.02543, "60": 0.02116 },
        "200000-499999": { "12": 0.08975, "24": 0.04660, "36": 0.03224, "48": 0.02508, "60": 0.02080 },
        "500001+": { "12": 0.08969, "24": 0.04653, "36": 0.03217, "48": 0.02501, "60": 0.02073 }
      };

      // State
      let currentTerm = '36';
      let currentAmount = 50000;

      // Initialize
      calculatePayments();

      // Event Listeners
      invoiceAmountInput.addEventListener('input', formatCurrencyInput);
      calculateBtn.addEventListener('click', calculatePayments);
      consultBtn.addEventListener('click', openModal);
      closeModal.addEventListener('click', closeModalHandler);

      termOptions.forEach(option => {
        option.addEventListener('click', function() {
          termOptions.forEach(opt => opt.classList.remove('active'));
          this.classList.add('active');
          currentTerm = this.dataset.months;
          updateSelectedPayment();
        });
      });

      consultationForm.addEventListener('submit', function(e) {
        e.preventDefault();
        submitForm();
      });

      // Functions
      function formatCurrencyInput(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        e.target.value = value;
        currentAmount = parseFloat(value.replace(/,/g, '')) || 0;
      }

      function calculatePayments() {
        const amount = parseFloat(invoiceAmountInput.value.replace(/,/g, '')) || 50000;
        currentAmount = amount;
        updateSelectedPayment();
      }

      function updateSelectedPayment() {
        const rate = getRate(currentAmount, currentTerm);
        const payment = currentAmount * rate;
        document.getElementById('selected-payment').textContent = formatCurrency(payment);
        document.getElementById('selected-term').textContent = `${currentTerm} month term`;
      }

      function getRate(amount, term) {
        let rateGroup;
        
        if (amount >= 10000 && amount <= 49999) {
          rateGroup = rates["10000-49999"];
        } else if (amount >= 50000 && amount <= 199999) {
          rateGroup = rates["50000-199999"];
        } else if (amount >= 200000 && amount <= 499999) {
          rateGroup = rates["200000-499999"];
        } else {
          rateGroup = rates["500001+"];
        }

        return rateGroup[term];
      }

      function formatCurrency(amount) {
        return '$' + amount.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
      }

      function openModal() {
        modalAmount.value = formatCurrency(currentAmount);
        modal.classList.add('active');
      }

      function closeModalHandler() {
        modal.classList.remove('active');
      }

      function submitForm() {
        // Show loading state
        submitText.textContent = 'Processing...';
        submitSpinner.classList.remove('hidden');

        // Simulate form submission
        setTimeout(() => {
          submitSpinner.classList.add('hidden');
          submitText.textContent = 'Success!';
          
          // Create confetti effect
          createConfetti();
          
          // Reset form after animation
          setTimeout(() => {
            submitText.textContent = 'Get Personalized Quote';
            consultationForm.reset();
            modal.classList.remove('active');
          }, 1500);
        }, 1500);
      }

      function createConfetti() {
        const modalContent = document.querySelector('.modal');
        const colors = ['#6C63FF', '#FF6584', '#FFB74D', '#4CAF50'];
        
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = Math.random() * 100 + '%';
          confetti.style.top = -10 + 'px';
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
          
          modalContent.appendChild(confetti);
          
          const animationDuration = Math.random() * 3 + 2;
          
          confetti.animate([
            { top: '-10px', opacity: 1, transform: `rotate(0deg)` },
            { top: '100%', opacity: 0, transform: `rotate(${Math.random() * 360}deg)` }
          ], {
            duration: animationDuration * 1000,
            easing: 'cubic-bezier(0.1, 0.8, 0.9, 1)'
          });
          
          setTimeout(() => {
            confetti.remove();
          }, animationDuration * 1000);
        }
      }

      // Close modal when clicking outside
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closeModalHandler();
        }
      });
    });
  </script>
</body>
</html>
